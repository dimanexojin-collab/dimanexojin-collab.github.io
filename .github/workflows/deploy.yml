name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию только чтение; нужные права выдаются отдельным задачам ниже.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Репозиторий должен называться <owner>.github.io, тогда сайт в корне домена.
      SITE: https://${{ github.repository_owner }}.github.io
    steps:
      # Версии закреплены по отпечатку коммита (защита от подмены метки). Обновляет Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
